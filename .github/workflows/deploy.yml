name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:
  schedule:
    # Runs at 03:30 UTC daily (cron is UTC)
    - cron: "0 0 * * 0"

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scholar-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # scholarly 1.7 uses the BibTeXParser 1 API and HTTPX's proxies argument.
          python -m pip install "scholarly==1.7.11" "bibtexparser==1.4.4" "httpx==0.27.2" "json5==0.12.1"

      - name: Update publications file
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          source="Google Scholar"
          status=0
          timeout --kill-after=10s 2m python -u src/scripts/update_publications_ts.py || status=$?
          case "$status" in
            75|124|137)
              echo "::notice::Google Scholar refresh unavailable. Trying OpenAlex."
              source="OpenAlex"
              status=0
              timeout --kill-after=10s 1m python -u src/scripts/update_publications_ts.py --source openalex || status=$?
              ;;
          esac
          case "$status" in
            0)
              echo "Publication refresh completed using $source." >> "$GITHUB_STEP_SUMMARY"
              ;;
            75|124|137)
              echo "::warning::Google Scholar and OpenAlex refreshes unavailable. Building with saved publication data."
              echo "Publication refresh skipped. The site will build with saved publication data." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$status" ;;
          esac

      - name: Install, build, and upload your site output
        uses: withastro/action@v4

      - name: Commit & push if changed
        run: |
          git add -- src/data/dynamic.ts src/data/static.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh publications"
          git push
        # with:
              # path: . # The root location of your Astro project inside the repository. (optional)
              # node-version: 22 # The specific version of Node that should be used to build your site. Defaults to 22. (optional)
              # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
